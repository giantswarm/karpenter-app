# ─── UPSTREAM ────────────────────────────────────────────────────────────────
upstream:
  nameOverride: karpenter
  additionalClusterRoleRules:
    - apiGroups: ["karpenter.sh"]
      resources: ["nodepools/finalizers", "nodeclaims/finalizers"]
      verbs: ["update"]
    - apiGroups: [""]
      resources: ["nodes/finalizers"]
      verbs: ["update"]
  settings:
    featureGates:
      # Alpha upstream, offered as tech preview
      staticCapacity: true

upstream-crd:
  additionalAnnotations:
    # Prevent Helm from cascade-deleting NodePools/NodeClaims/EC2NodeClasses
    # if the HelmRelease is ever uninstalled. The pre-2.3.0 forked CRDs had
    # this annotation; the upstream karpenter-crd chart does not set it.
    helm.sh/resource-policy: keep

# ─── EXTRAS ──────────────────────────────────────────────────────────────────
kyverno:
  # The `PolicyException` needs Kyverno's CRDs, which only exist if Kyverno is installed
  enabled: true
kyvernoPolicyExceptions:
  enabled: true
  legacy:
    # Renders the kyverno.io/v2 PolicyException, which applies to ClusterPolicies only. Will be used as a global switch in a future release.
    enabled: true
podLogs:
  enabled: false
  tenant: ""
