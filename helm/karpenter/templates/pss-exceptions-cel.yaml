{{- if and .Values.kyverno.enabled .Values.kyvernoPolicyExceptions.enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: karpenter
  namespace: kube-system
  labels:
    {{- include "karpenter.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
spec:
  policyRefs:
    - name: require-run-as-nonroot
      kind: ValidatingPolicy
    - name: disallow-privilege-escalation
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: disallow-privileged-containers
      kind: ValidatingPolicy
    - name: disallow-capabilities-strict
      kind: ValidatingPolicy
    - name: restrict-seccomp-strict
      kind: ValidatingPolicy
    - name: restrict-volume-types
      kind: ValidatingPolicy
    # check-resources-request-and-limits-ratio is a supplemental policy and
    # usually not enabled. It is excepted because the karpenter Deployment fails
    # it when the policy is enforced.
    - name: check-resources-request-and-limits-ratio
      kind: ValidatingPolicy
  matchConditions:
    - name: karpenter-workloads
      expression: >-
        request.kind.kind in ['Deployment', 'ReplicaSet', 'Pod', 'CronJob', 'Job'] &&
        request.namespace == '{{ .Release.Namespace }}' &&
        has(object.metadata.name) &&
        (object.metadata.name == 'karpenter' || object.metadata.name.startsWith('karpenter-'))
{{- end }}
