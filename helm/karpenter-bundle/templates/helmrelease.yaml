apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: {{ .Values.clusterID }}-karpenter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter-bundle.labels" . | nindent 4 }}
spec:
  url: {{ .Values.ociRepositoryUrl }}
  interval: 1h
  ref:
    tag: {{ .Chart.AppVersion }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Values.clusterID }}-karpenter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter-bundle.labels" . | nindent 4 }}
spec:
  interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  kubeConfig:
    secretRef:
      name: {{ .Values.clusterID }}-kubeconfig
  chartRef:
    kind: OCIRepository
    name: {{ .Values.clusterID }}-karpenter
    namespace: {{ .Release.Namespace }}
  {{- /* `dependsOn` is templated so that a dependency can be made conditional */}}
  {{- $dependsOn := list }}
  {{- range $dependency, $enabled := .Values.helmRelease.dependsOn }}
  {{- if kindIs "string" $enabled }}
  {{- $enabled = eq (tpl $enabled $ | trim) "true" }}
  {{- end }}
  {{- if $enabled }}
  {{- $dependsOn = append $dependsOn $dependency }}
  {{- end }}
  {{- end }}
  {{- if $dependsOn }}
  dependsOn:
  {{- range $dependsOn }}
  - name: {{ include "karpenter-bundle.clusterID" $ }}-{{ . }}
    namespace: {{ $.Release.Namespace }}
  {{- end }}
  {{- end }}
  releaseName: karpenter
  targetNamespace: karpenter
  storageNamespace: karpenter
  valuesFrom:
    - kind: ConfigMap
      name: {{ include "karpenter-bundle.configMapName" . }}
      valuesKey: values
      optional: false
