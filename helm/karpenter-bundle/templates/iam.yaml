{{- $awsPartition := include "karpenter-bundle.awsPartition" . -}}
{{- $workersIamRole := include "karpenter-bundle.workersIamRole" . -}}
{{- $sqsQueueArn := include "karpenter-bundle.sqsQueueArn" . -}}
apiVersion: iam.aws.upbound.io/v1beta1
kind: Role
metadata:
  name: {{ .Values.clusterID }}-karpenter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter-bundle.labels" . | nindent 4 }}
spec:
  providerConfigRef:
    name: {{ .Values.clusterID }}
  forProvider:
    tags:
      giantswarm.io/cluster: {{ .Values.clusterID }}
      giantswarm.io/managed-by: {{ .Release.Name | quote }}
      sigs.k8s.io/cluster-api-provider-aws/cluster/{{ .Values.clusterID }}: owned
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {{- include "karpenter-bundle.trustPolicyStatements" . | nindent 10 }}
        ]
      }
    inlinePolicy:
      - name: karpenter-policy
        policy: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Resource": "*",
                "Action": [
                  "ec2:CreateFleet",
                  "ec2:CreateLaunchTemplate",
                  "ec2:CreateTags",
                  "ec2:DeleteLaunchTemplate",
                  "ec2:RunInstances",
                  "ec2:TerminateInstances",
                  "ec2:DescribeAvailabilityZones",
                  "ec2:DescribeImages",
                  "ec2:DescribeInstances",
                  "ec2:DescribeInstanceTypeOfferings",
                  "ec2:DescribeInstanceTypes",
                  "ec2:DescribeLaunchTemplates",
                  "ec2:DescribeSecurityGroups",
                  "ec2:DescribeSpotPriceHistory",
                  "ec2:DescribeSubnets",
                  "eks:DescribeCluster",
                  "pricing:GetProducts",
                  "ssm:GetParameter",
                  "iam:ListInstanceProfiles",
                  "iam:GetInstanceProfile"
                ]
              },
              {
                "Effect": "Allow",
                "Action": [
                  "sqs:DeleteMessage",
                  "sqs:GetQueueAttributes",
                  "sqs:GetQueueUrl",
                  "sqs:ReceiveMessage"
                ],
                "Resource": "{{ $sqsQueueArn }}"
              },
              {
                "Effect": "Allow",
                "Action": [
                  "iam:PassRole"
                ],
                "Resource": "{{ $workersIamRole }}"
              }
            ]
          }
---
apiVersion: iam.aws.upbound.io/v1beta1
kind: Role
metadata:
  name: {{ .Values.clusterID }}-karpenter-nodeclassgenerator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter-bundle.labels" . | nindent 4 }}
spec:
  providerConfigRef:
    name: {{ .Values.clusterID }}
  forProvider:
    tags:
      giantswarm.io/cluster: {{ .Values.clusterID }}
      giantswarm.io/managed-by: {{ .Release.Name | quote }}
      sigs.k8s.io/cluster-api-provider-aws/cluster/{{ .Values.clusterID }}: owned
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {{- include "karpenter-bundle.trustPolicyStatements" . | nindent 10 }}
        ]
      }
    inlinePolicy:
      - name: karpenter-policy
        policy: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Resource": "*",
                "Action": [
                  "ec2:DescribeAutoScalingGroups",
                  "ec2:DescribeLaunchTemplates",
                  "ec2:DescribeLaunchTemplateVersions"
                ]
              }
            ]
          }
{{- if .Values.nodeIamRole.create }}
{{- $ec2ServicePrincipal := eq $awsPartition "aws-cn" | ternary "ec2.amazonaws.com.cn" "ec2.amazonaws.com" }}
---
{{/* Named to match the `iam:PassRole` wildcard the karpenter controller role is scoped to */}}
apiVersion: iam.aws.upbound.io/v1beta1
kind: Role
metadata:
  name: nodes-karpenter-{{ .Values.clusterID }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter-bundle.labels" . | nindent 4 }}
spec:
  providerConfigRef:
    name: {{ .Values.clusterID }}
  forProvider:
    tags:
      giantswarm.io/cluster: {{ .Values.clusterID }}
      giantswarm.io/managed-by: {{ .Release.Name | quote }}
      sigs.k8s.io/cluster-api-provider-aws/cluster/{{ .Values.clusterID }}: owned
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "Service": "{{ $ec2ServicePrincipal }}"
            },
            "Action": "sts:AssumeRole"
          }
        ]
      }
{{- /* The same policies CAPA attaches to EKS managed node group roles. AmazonEKS_CNI_Policy is
       required because Cilium runs in ENI IPAM mode without IRSA and manages ENIs through the
       node instance role. */}}
{{- range $policy := list "AmazonEKSWorkerNodePolicy" "AmazonEKS_CNI_Policy" "AmazonEC2ContainerRegistryReadOnly" }}
---
apiVersion: iam.aws.upbound.io/v1beta1
kind: RolePolicyAttachment
metadata:
  name: nodes-karpenter-{{ $.Values.clusterID }}-{{ $policy | lower | replace "_" "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "karpenter-bundle.labels" $ | nindent 4 }}
spec:
  providerConfigRef:
    name: {{ $.Values.clusterID }}
  forProvider:
    policyArn: arn:{{ $awsPartition }}:iam::aws:policy/{{ $policy }}
    roleRef:
      name: nodes-karpenter-{{ $.Values.clusterID }}
{{- end }}
---
apiVersion: iam.aws.upbound.io/v1beta1
kind: InstanceProfile
metadata:
  name: nodes-karpenter-{{ .Values.clusterID }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter-bundle.labels" . | nindent 4 }}
spec:
  providerConfigRef:
    name: {{ .Values.clusterID }}
  forProvider:
    tags:
      giantswarm.io/cluster: {{ .Values.clusterID }}
      giantswarm.io/managed-by: {{ .Release.Name | quote }}
      sigs.k8s.io/cluster-api-provider-aws/cluster/{{ .Values.clusterID }}: owned
    roleRef:
      name: nodes-karpenter-{{ .Values.clusterID }}
{{- end }}
