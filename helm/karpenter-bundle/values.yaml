# ─── BUNDLE-ONLY ─────────────────────────────────────────────────────────────
# These values are used by the bundle chart only and never forwarded to the workload chart.
clusterID: ""
region: ""
workersIamRole: ""
ociRepositoryUrl: oci://gsoci.azurecr.io/charts/giantswarm/karpenter
helmRelease:
  # Each value is evaluated as a Go template. Dependencies whose value does not result in `true` are skipped.
  dependsOn:
    alloy-podlogs-crds: '{{ $.Values.podLogs.enabled }}'
    cilium: true
    cloud-provider-aws: true
    kyverno-crds: true
nodeIamRole:
  # EKS clusters need an IAM role and instance profile for the nodes karpenter launches. On CAPA
  # clusters the worker instance profile comes from the cluster chart instead.
  create: false

# ─── UPSTREAM ────────────────────────────────────────────────────────────────
# These values are transformed and routed under the `upstream:` key to the workload chart.
controller:
  image:
    repository: gsoci.azurecr.io/giantswarm/karpenter-controller
    tag: "1.8.1"
    digest: "sha256:35044629d7b890852fd770a8f69b303f3cbbd5695beef5af670faab1da269b17"
  resources:
    requests:
      cpu: 0.1
      memory: 50Mi
    limits:
      cpu: 1
      memory: 1Gi

serviceAccount:
  create: true
  name: ""
  annotations: {}

settings:
  clusterName: ""
  interruptionQueue: ""
  featureGates:
    nodeRepair: true
    spotToSpotConsolidation: true
    staticCapacity: true

proxy:
  http: ""
  https: ""
  noProxy: ""

# ─── EXTRAS ──────────────────────────────────────────────────────────────────
# These values are forwarded at top level (not under upstream:) to the workload chart.
podLogs:
  enabled: false
  tenant: ""
